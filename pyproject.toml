[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "droidshield"
version = "0.5.0"
description = "Mobile security assessment workspace and isolated analysis workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.163",
  "starlette>=1.7,<2",
  "anyio>=4.10,<5",
  "uvicorn>=0.54,<0.55",
  "sqlalchemy>=2.0.44,<2.2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "email-validator>=2.3,<3",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.3,<4",
  "python-multipart>=0.0.32,<0.1",
  "httpx>=0.28,<0.29",
  "cryptography>=46,<51",
  "reportlab>=4.5.1,<5.2",
  "Pillow>=12,<14",
  "cvss==3.6",
  "uharfbuzz==0.57.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<0.29", "ruff>=0.16,<0.18", "pypdf>=6,<7"]
instrumentation = ["frida==17.26.0"]

[project.scripts]
droidshield = "droidshield.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
droidshield = ["migrations/script.py.mako", "web/*.html", "web/*.css", "web/*.js", "frida_agent.js", "report_fonts/*.ttf", "report_fonts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
