name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Bubblewrap and restricted AppArmor profile
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap

          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [[ ! -r "$profile" ]]; then
            profile=/etc/apparmor.d/bwrap-userns-restrict
          fi
          if [[ ! -r "$profile" ]]; then
            echo "Ubuntu's restricted Bubblewrap AppArmor profile is unavailable" >&2
            exit 1
          fi
          sudo apparmor_parser --replace "$profile"

      - name: Verify Bubblewrap isolation is available
        run: |
          args=()
          for runtime in /usr/lib /usr/lib64 /lib /lib64; do
            if [[ -e "$runtime" ]]; then
              args+=(--ro-bind "$runtime" "$runtime")
            fi
          done
          args+=(--ro-bind /usr/bin/true /usr/bin/true)

          bwrap "${args[@]}" \
            --unshare-all \
            --unshare-user \
            --unshare-net \
            --unshare-pid \
            --disable-userns \
            --assert-userns-disabled \
            --die-with-parent \
            --new-session \
            --cap-drop ALL \
            --proc /proc \
            --dev /dev \
            --size 33554432 \
            --tmpfs /tmp \
            --dir /input \
            --dir /engine \
            --remount-ro / \
            --clearenv \
            --chdir /tmp \
            -- /usr/bin/true

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run backend tests
        run: pytest

      - name: Check lint
        run: ruff check backend tests

      - name: Check formatting
        run: ruff format --check backend tests

      - name: Check database migrations
        run: |
          mkdir -p var
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend tests (Node.js 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run frontend tests
        run: node --test tests/frontend.mjs
